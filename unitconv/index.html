<!DOCTYPE html>
<HTML TRANSLATE="no"><HEAD><TITLE>UnitConv</TITLE><LINK REL='stylesheet' HREF='styles.css'>

<SCRIPT LANGUAGE="JavaScript">
<!--
if (document.location.search=="?") {document.location="view-source:"+document.location;}

function a2b(a,b,c,x)
{
  return Math.floor((x-a)*b*c)/c;
}

function b2a(a,b,c,x)
{
  return Math.floor((x*b+a)*c)/c;
}

//-->
</SCRIPT>
</HEAD>

<BODY>
<DIV id="ttl">unit conversion routines</DIV>

<FORM NAME='myform'>
<TABLE>
<TR><TH>Fahrenheit</TH><TH WIDTH='120'>&nbsp;</TH><TH>Celcius</TH></TR>
<TR>
<TD ALIGN="right"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="afar"></TD>
<TD ALIGN="center"><INPUT TYPE="button" VALUE=" to C => " ONCLICK="acel.value=a2b(32,5/9,100,afar.value)"><BR><INPUT TYPE="button" VALUE=" <= to F " ONCLICK="afar.value=b2a(32,9/5,100,acel.value)"></TD>
<TD ALIGN="left"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="acel"></TD>
</TR></TABLE>
  
<P>
<TABLE>
<TR><TH>mile</TH><TH WIDTH='120'>&nbsp;</TH><TH>kilometer</TH></TR>
<TR>
<TD ALIGN="right"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="amil">
<TD ALIGN="center"><INPUT TYPE="button" VALUE="  to km =>  " ONCLICK="akm.value=a2b(0,1.6093,100,amil.value)">
<BR><INPUT TYPE="button" VALUE=" <= to miles " ONCLICK="amil.value=a2b(0,1/1.6093,100,akm.value)">
<TD ALIGN="left"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="akm">
</TR></TABLE>

<P>
<TABLE>
<TR><TH>inch</TH><TH WIDTH='120'>&nbsp;</TH><TH>centimeter</TH></TR>
<TR>
<TD ALIGN="right"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="ain">
<TD ALIGN="center"><INPUT TYPE="button" VALUE="  to cm =>  " ONCLICK="acm.value=a2b(0,2.54,1000,ain.value)">
<BR><INPUT TYPE="button" VALUE=" <= to in " ONCLICK="ain.value=a2b(0,1/2.54,1000,acm.value)">
<TD ALIGN="left"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="acm">
</TR></TABLE>
  
<P>

<TR>
<TD ALIGN="right"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="oz">

<BR><INPUT TYPE="button" VALUE=" <= to ounces " ONCLICK="oz.value=a2b(0,1/28.35,1000,gr.value)">
<TD ALIGN="left"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="gr">
</TR></TABLE>
  
<P>
<TABLE>
<TR><TH>pound</TH><TH WIDTH='120'>&nbsp;</TH><TH>kilogram</TH></TR>
<TR>

<BR><INPUT TYPE="button" VALUE=" <= to pounds " ONCLICK="lb.value=a2b(0,2.2046,100,kg.value)">
<TD ALIGN="left"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="kg">
</TR></TABLE>
  
<P>
<TABLE>
<TR><TH>fl oz</TH><TH WIDTH='120'>&nbsp;</TH><TH>ml</TH></TR>

<BR><INPUT TYPE="button" VALUE=" <= to fl oz " ONCLICK="floz.value=a2b(0,1/29.574,1000,ml.value)">

<P>
<TABLE>

<P>
<TABLE>

<TD ALIGN="right"><INPUT TYPE="text" SIZE=10 VALUE="" NAME="psi">
