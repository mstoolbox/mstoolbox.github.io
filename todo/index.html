<!DOCTYPE html>
<HTML TRANSLATE="no"><HEAD><TITLE>ToDoList</TITLE>
<HEAD>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="text-scale" content="scale">
<link rel="stylesheet" href="icons.css">
<link rel="stylesheet" href="styles.css">
<script>
function displayItems() {
  let outstr = "";
  let keys = sortKeys(localStorage);
  for (let i = 0; i < keys.length; i++) {
    outstr += makeItem(keys[i], localStorage.getItem(keys[i]));
  }
  document.getElementById("tasks").innerHTML = outstr;
  for (let i = 0; i < keys.length; i++) {
    if (localStorage.getItem(keys[i]).indexOf('\u200D') < 0) {
	  document.getElementById(keys[i] + "O").className = 'notdone';
      document.getElementById(keys[i] + "O").style.opacity = "1.0";
	  document.getElementById(keys[i]).checked = false;
	}
    else {
      document.getElementById(keys[i] + "O").className = 'isdone';
      document.getElementById(keys[i] + "O").style.opacity = "0.4";
	  document.getElementById(keys[i]).checked = true;
    }
  }
}

function makeItem(thekey, theval) {
  let outstr1 = "";
  outstr1 += "<PRE id='???O' class='notdone'><DIV id='???Z' CLASS='items' style='display: block; align-items: center; width:100%; border: 1px solid red;'>";
  outstr1 += "<DL><DT><INPUT type='checkbox' id='???' onClick='isDone(this.id)'></DT>";
  outstr1 += "<DD><SPAN id='???X' onClick='isDone(this.id)'>" + theval + "</SPAN>";
  outstr1 += "<button class='btn floatright' id='???Y' onClick='deleteItem(this.id)' title='add new task'><i class='icon icon-sm icon-jr-delthis'></i></button></DD>";
  outstr1 += "</DL></DIV></PRE>";
	
  let outstr2 = "";
  outstr2 += "<PRE id='???O' class='notdone'><DIV id='???Z' CLASS='items' style='display: block; align-items: center; width:100%; border: 1px solid red;'>";
  outstr2 += "<SPAN><INPUT type='checkbox' id='???' onClick='isDone(this.id)'></SPAN>&nbsp;";
  outstr2 += "<SPAN id='???X' onClick='isDone(this.id)'>" + theval + "</SPAN><SPAN WIDTH='100%'>&nbsp;</SPAN>";
  outstr2 += "<SPAN class='floatright'><button class='btn' id='???Y' onClick='deleteItem(this.id)' title='add new task'><i class='icon icon-sm icon-jr-delthis'></i></button></SPAN>";
  outstr2 += "</DIV></PRE>";

  let outstr3 = "";
  outstr3 += "<PRE id='???O' class='notdone'><DIV id='???Z' CLASS='items' style='display: block; align-items: center; width:100%; border: 1px solid red;'>";
  outstr3 += "<DIV><INPUT type='checkbox' id='???' onClick='isDone(this.id)'></DIV>";
  outstr3 += "<DIV id='???X' onClick='isDone(this.id)'>" + theval + "</DIV>";
  outstr3 += "<DIV class='floatright'><button class='btn' id='???Y' onClick='deleteItem(this.id)' title='add new task'><i class='icon icon-sm icon-jr-delthis'></i></button></DIV>";
  outstr3 += "</DIV></PRE>";

  let outstr = "";

  outstr += "<PRE id='???O' class='notdone'><div style='display: table-row;width=100%;' id='???Z' CLASS='items'>";
  outstr += "<div style='width: 20px; display: table-cell;'><INPUT type='checkbox' id='???' onClick='isDone(this.id)'></div>";
  outstr += "<div id='???X' onClick='isDone(this.id)' style='width: 90%; display: table-cell;border: 2px solid red;'float: none; overflow:hidden;>" + theval + "</DIV>";
  outstr += "<div style='display: table-cell;padding-right:0px;border: 2px solid black;text-align:right;margin-right:0px'><button class='btn' id='???Y' onClick='deleteItem(this.id)' title='add new task'><i class='icon icon-sm icon-jr-delthis'></i></button></div>";
  outstr += "</PRE>";

	
  return outstr.replaceAll("???",thekey);



}


function delAll() {
  localStorage.clear();
  displayItems();
}

function delDone() {
  let keys = Object.keys(localStorage);
  for (let i = 0; i < keys.length; i++) {
    let value = localStorage.getItem(keys[i]);
    if (value.indexOf('\u200D') > 0) {
      localStorage.removeItem(keys[i]);
    }
  }
  displayItems();
}

function addItem() {
  let thetask = document.getElementById("inp").value;
  if (thetask.length > 0) {
    localStorage.setItem(Date.now(),document.getElementById("inp").value);
	document.getElementById("inp").value = "";
    displayItems();
  }
}

function deleteItem(what) {
  what = what.replace(/[^0-9]/g,"");
  localStorage.removeItem(what);
  displayItems();
}

function isDone(what) {
  what = what.replace(/[^0-9]/g,"");
  let theclass = document.getElementById(what + "O").classname;
  let theval = localStorage.getItem(what);
  if (theval.indexOf('\u200D') < 0) {
	theval += '\u200D';
  }
  else {
	theval = theval.replaceAll("\u200D","");
  }
  localStorage.setItem(what,theval);
  displayItems();
}

function sortKeys(obj) {
  let keys = Object.keys(obj).sort((a, b) => {
    if (a < b) return -1;
    if (a > b) return 1;
    return 0;
  });
  return keys;
}
</script>
</HEAD>
<BODY>
<DIV id="ttl">ToDo list</DIV>
	
<DIV id="container">
<DIV style="display: flex; align-items: center;">
<textarea id="inp" placeholder="Enter task..." maxlength="50"></textarea>
<button class="btn" onClick="addItem()" title="add new task"><i class="icon icon-jr-add"></i></button> &nbsp;
<button class="btn" onClick="delDone()" title="delete tasks done"><i class="icon icon-jr-clean"></i></button> &nbsp;
<button class="btn" onClick="delAll()" title="delete all tasks"><i class="icon icon-jr-delete"></i></button></DIV>

<DIV id="tasks" style='width: 100%; display: table;'>></DIV>
</DIV> <!-- container -->

<DIV id="ftr">written by Jef Rozenski<BR><A HREF='https://mstoolbox.github.io'>Masspec Toolbox</A></DIV>
<script>
displayItems();
</script>
</body>
</html>
