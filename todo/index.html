<!DOCTYPE html>
<HTML TRANSLATE="no"><HEAD><TITLE>ToDoList</TITLE><LINK REL='stylesheet' HREF='styles.css'>
<HEAD>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="text-scale" content="scale">
<link rel="stylesheet" href="icons.css">
<script>
function displayItems() {
  let outstr = "";
  let keys = sortKeys(localStorage);
  for (let i = 0; i < keys.length; i++) {
    outstr += makeItem(keys[i], localStorage.getItem(keys[i]));
  }
  document.getElementById("tasks").innerHTML = outstr;
  for (let i = 0; i < keys.length; i++) {
    if (localStorage.getItem(keys[i]).indexOf('\u200D') < 0) {
	  document.getElementById(keys[i] + "X").className = 'notdone';
      document.getElementById(keys[i] + "Z").style.opacity = "1.0";
	  document.getElementById(keys[i]).checked = false;
	}
    else {
      document.getElementById(keys[i] + "X").className = 'isdone';
      document.getElementById(keys[i] + "Z").style.opacity = "0.4";
	  document.getElementById(keys[i]).checked = true;;
    }
  }
}

function makeItem(thekey, theval) {
  let outstr = "";
  outstr += "<PRE><DIV id='" + thekey + "Z' CLASS='items'>";
  outstr += "<DL><DT><INPUT type='checkbox' id='" + thekey + "' onClick='isDone(this.id)'></DT>";
  outstr += "<DD><SPAN id='" + thekey + "X' class='notdone' onClick='isDone(this.id)'>" + theval + "</SPAN>";
  outstr += "<A HREF='' id='" + thekey + "Y' style='float:right;' onClick='deleteItem(this.id)'>[delete]</A></DD>";
  outstr += "</DL></DIV></PRE>";
  return outstr;
}

function delAll() {
  localStorage.clear();
  displayItems();
}

function delDone() {
  let tempStorage = localStorage;
  for (i = 0; i < tempStorage.length; i++) {
	let value = localStorage.getItem(tempStorage.key(i));
	console.log(i, tempStorage.key(i), value,tempStorage.length);
    if (value.indexOf('\u200D') > 0) {
      localStorage.removeItem(tempStorage.key(i));
    }
  }
  displayItems();
}

function addItem() {
  let thetask = document.getElementById("inp").value;
  if (thetask.length > 0) {
    localStorage.setItem(Date.now(),document.getElementById("inp").value);
	document.getElementById("inp").value = "";
    displayItems();
  }
}

function deleteItem(what) {
  what = what.replace(/[^0-9]/g,"");
  localStorage.removeItem(what);
  displayItems();
}

function isDone(what) {
  what = what.replace(/[^0-9]/g,"");
  let theclass = document.getElementById(what + "X").classname;
  let theval = localStorage.getItem(what);
  if (theval.indexOf('\u200D') < 0) {
	theval += '\u200D';
  }
  else {
	theval = theval.replaceAll("\u200D","");
  }
  localStorage.setItem(what,theval);
  displayItems();
}

function sortKeys(obj) {
  let keys = Object.keys(obj).sort((a, b) => {
    if (a < b) return -1;
    if (a > b) return 1;
    return 0;
  });
  return keys;
}
</script>
</HEAD>
<BODY>
<DIV id="ttl">ToDo list</DIV>
	
<DIV id="container">
<DIV style="display: flex; align-items: center;">
<textarea id="inp" placeholder="Enter task..."></textarea>
<button class="btn" onClick="addItem()" title="add new task"><i class="icon icon-jr-add"></i></button> &nbsp;
<button class="btn" onClick="delDone()" title="delete tasks done"><i class="icon icon-jr-clean"></i></button> &nbsp;
<button class="btn" onClick="delAll()" title="delete all tasks"><i class="icon icon-jr-delete"></i></button></DIV>

<DIV id="tasks"></DIV>
</DIV> <!-- container -->

<DIV id="ftr">written by Jef Rozenski<BR><A HREF='https://mstoolbox.github.io'>Masspec Toolbox</A></DIV>
<script>
displayItems();
</script>
</body>
</html>
